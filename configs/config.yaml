model:
  model_type: "vit_l"
  checkpoint: "sam_vit_l_0b3195.pth"
  device: "cuda"

auto_mask_generator:
  points_per_side: 32
  pred_iou_thresh: 0.88
  stability_score_thresh: 0.95
  min_mask_region_area: 100

processing:
  max_image_size: 2048
  mask_threshold: 0.0

background_removal:
  feather_radius: 3
  output_format: "png"
